<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PocketSmart AI - Register</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/auth.css') }}"
    >

</head>


<body>

    <div class="auth-background"></div>


    <main class="auth-container">

        <section class="auth-card">


            <!-- LOGO -->

            <div class="auth-logo">

                <div class="logo-reactor">
                    ◉
                </div>

                <span>
                    PocketSmart <b>AI</b>
                </span>

            </div>


            <!-- TITLE -->

            <div class="auth-heading">

                <h1>
                    Create Account
                </h1>

                <p>
                    Start building a smarter way
                    to manage your money.
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form
                id="registerForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >

                    Create Account

                </button>


                <div
                    id="registerMessage"
                    class="auth-message"
                ></div>

            </form>


            <!-- LOGIN -->

            <div class="auth-switch">

                <span>
                    Already have an account?
                </span>

                <a href="/login">
                    Sign in
                </a>

            </div>


        </section>

    </main>


    <script
        src="{{ url_for('static', path='js/auth.js') }}"
    ></script>

</body>

</html>
