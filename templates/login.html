<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PocketSmart AI - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/auth.css') }}"
    >

</head>


<body>

    <div class="auth-background"></div>


    <main class="auth-container">

        <section class="auth-card">


            <!-- LOGO -->

            <div class="auth-logo">

                <div class="logo-reactor">
                    ◉
                </div>

                <span>
                    PocketSmart <b>AI</b>
                </span>

            </div>


            <!-- TITLE -->

            <div class="auth-heading">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to continue to your
                    smart financial workspace.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >

                    Sign In

                </button>


                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>

            </form>


            <!-- REGISTER -->

            <div class="auth-switch">

                <span>
                    Don't have an account?
                </span>

                <a href="/register">
                    Create one
                </a>

            </div>


        </section>

    </main>


    <script
        src="{{ url_for('static', path='js/auth.js') }}"
    ></script>

</body>

</html>
